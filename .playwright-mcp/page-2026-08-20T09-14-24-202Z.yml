    - generic [ref=f7e130]:
      - generic [ref=f7e140]:
        - heading "Navigating the Estatein Experience" [level=2] [ref=f7e141]
        - paragraph [ref=f7e142]: At Estatein, we've designed a straightforward process to help you find and purchase your dream property with ease. Here's a step-by-step guide to how it all works.
      - list [ref=f7e143]:
        - listitem [ref=f7e144]:
          - paragraph [ref=f7e145]: Step 01
          - generic [ref=f7e146]:
            - heading "Discover a World of Possibilities" [level=3] [ref=f7e147]
            - paragraph [ref=f7e148]: Your journey begins with exploring our carefully curated property listings. Use our intuitive search tools to filter properties based on your preferences, including location, type, size, and budget.
        - listitem [ref=f7e149]:
          - paragraph [ref=f7e150]: Step 02
          - generic [ref=f7e151]:
            - heading "Narrowing Down Your Choices" [level=3] [ref=f7e152]
            - paragraph [ref=f7e153]: Once you've found properties that catch your eye, save them to your account or make a shortlist. This allows you to compare and revisit your favourites as you make your decision.
        - listitem [ref=f7e154]:
          - paragraph [ref=f7e155]: Step 03
          - generic [ref=f7e156]:
            - heading "Personalized Guidance" [level=3] [ref=f7e157]
            - paragraph [ref=f7e158]: Have questions about a property or need more information? Our dedicated team of real estate experts is just a call or message away.
        - listitem [ref=f7e159]:
          - paragraph [ref=f7e160]: Step 04
          - generic [ref=f7e161]:
            - heading "See It for Yourself" [level=3] [ref=f7e162]
            - paragraph [ref=f7e163]: Arrange viewings of the properties you're interested in. We'll coordinate with the property owners and accompany you to ensure you get a firsthand look at your potential new home.
        - listitem [ref=f7e164]:
          - paragraph [ref=f7e165]: Step 05
          - generic [ref=f7e166]:
            - heading "Making Informed Decisions" [level=3] [ref=f7e167]
            - paragraph [ref=f7e168]: Before making an offer, our team will assist you with due diligence, including property inspections, legal checks, and market analysis. We want you to be fully informed and confident in your choice.
        - listitem [ref=f7e169]:
          - paragraph [ref=f7e170]: Step 06
          - generic [ref=f7e171]:
            - heading "Getting the Best Deal" [level=3] [ref=f7e172]
            - paragraph [ref=f7e173]: We'll help you negotiate the best terms and prepare your offer. Our goal is to secure the property at the right price and on favourable terms.
